{{ $src := .Get "src" }}
{{ $fields := .Get "fields" }}
{{ if not $fields }}{{ $fields = printf "%s:%s" (.Get "field") (.Get "field") }}{{ end }}
<div class="attn-viz" data-src="{{ $src | absURL }}" data-fields="{{ $fields }}" data-row-label="{{ .Get "row-label" | default "row" }}" data-col-label="{{ .Get "col-label" | default "col" }}">
  <div class="attn-viz-controls">
    <select class="attn-viz-layer" aria-label="Layer"></select>
    <select class="attn-viz-head" aria-label="Head"></select>
    <select class="attn-viz-field" aria-label="Field"></select>
  </div>
  <div class="attn-viz-grid"></div>
  <p class="attn-viz-caption"></p>
</div>
