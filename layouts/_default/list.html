{{ define "main" }}
<h1>{{ .Title }}</h1>
<ul class="post-list">
  {{ range partial "listed.html" .Pages }}
  <li>
    <a href="{{ strings.TrimSuffix "/" .Permalink }}">{{ .Title }}</a>
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "Jan 2, 2006" }}</time>
  </li>
  {{ end }}
</ul>
{{ end }}
