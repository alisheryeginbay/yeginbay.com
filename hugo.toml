baseURL = "https://yeginbay.com/"
locale = "en-us"
title = "Alisher Yeginbay"
enableGitInfo = true

[params]
  description = "Notes and writing."
  # Posts without #+author: are by this author. data/authors.toml says
  # where author names link to.
  author = "Alisher Yeginbay"
  repo = "https://github.com/alisheryeginbay/yeginbay.com"

[markup.org]
  # keep TOC/heading behavior default; org files are parsed natively by Hugo

[markup.highlight]
  # Emit classes instead of inline colours, so code is coloured by the
  # .chroma rules in assets/css/style.css.
  noClasses = false

[taxonomies]
  tag = "tags"

[permalinks]
  posts = "/:filename/"

[security]
  allowContent = ['! ^text/html$']
