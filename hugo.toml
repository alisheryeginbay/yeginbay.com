baseURL = "https://yeginbay.com/"
locale = "en-us"
title = "Alisher Yeginbay"
enableGitInfo = true
# Posts written in Typst reach Hugo through content/_content.gotmpl, not as
# files of their own; their source is published by the single layout.
ignoreFiles = ['\.typ$']

[params]
  description = "Notes and writing."
  # Posts without #+author: are by this author. data/authors.toml says
  # where author names link to.
  author = "Alisher Yeginbay"
  repo = "https://github.com/alisheryeginbay/yeginbay.com"
  # Sections whose pages are posts: shown on the writings page, with the
  # post meta line, drop cap and published org source.
  postSections = ["posts", "proofs"]

[markup.org]
  # keep TOC/heading behavior default; org files are parsed natively by Hugo

[markup.highlight]
  # Emit classes instead of inline colours, so code is coloured by the
  # .chroma rules in assets/css/style.css.
  noClasses = false

[taxonomies]
  tag = "tags"

[permalinks]
  posts = "/:filename/"

[security]
  # Org posts, and the HTML that scripts/compile-typst.ts makes of .typ ones.
  allowContent = ['^text/org$', '^text/html$']
